workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 60
    environment:
      node: 18.17.0
      java: 17
    scripts:
      - npm install
      - npx expo prebuild --platform android
      - cd android && ./gradlew assembleRelease
    artifacts:
      - android/app/build/outputs/**/*.apk

  ios-workflow:
    name: iOS Build
    max_build_duration: 60
    environment:
      node: 18.17.0
      xcode: latest
    scripts:
      - npm install
      - npx expo prebuild --platform ios
      - xcodebuild -workspace ios/*.xcworkspace -scheme webviewapp -configuration Release -archivePath build/App.xcarchive archive
    artifacts:
      - build/**/*.ipa
