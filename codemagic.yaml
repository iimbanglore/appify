# Codemagic CI/CD configuration for Tinkklebox
# Generated by Web2App Converter

workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        PACKAGE_NAME: com.tinnklebox.shop
      node: 18.17.0
      java: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate Android project
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android APK
        script: |
          cd android && ./gradlew assembleRelease --no-daemon
      - name: Build Android App Bundle (AAB)
        script: |
          cd android && ./gradlew bundleRelease --no-daemon
      - name: Organize artifacts
        script: |
          mkdir -p $CM_BUILD_DIR/build/outputs
          find android/app/build/outputs -name "*.apk" -exec cp {} $CM_BUILD_DIR/build/outputs/ \;
          find android/app/build/outputs -name "*.aab" -exec cp {} $CM_BUILD_DIR/build/outputs/ \;
          ls -la $CM_BUILD_DIR/build/outputs/
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - build/outputs/*.apk
      - build/outputs/*.aab
    publishing:
      email:
        recipients:
          - team@example.com
        notify:
          success: false
          failure: true

  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        BUNDLE_ID: com.tinnklebox.shop
      node: 18.17.0
      xcode: 16.2
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Install CocoaPods
        script: |
          cd ios && pod install
      - name: Create exportOptions.plist
        script: |
          cat > ios/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
      - name: Build iOS Archive
        script: |
          cd ios
          SCHEME_NAME=$(xcodebuild -list -json | jq -r '.project.schemes[0]')
          xcodebuild -workspace *.xcworkspace -scheme "$SCHEME_NAME" -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Create unsigned IPA
        script: |
          mkdir -p $CM_BUILD_DIR/build/ipa
          cd $CM_BUILD_DIR/build/App.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r $CM_BUILD_DIR/build/ipa/Tinkklebox.ipa Payload
          ls -la $CM_BUILD_DIR/build/ipa/
    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
