# Codemagic CI/CD configuration for SmartFinance
# Generated by Web2App Converter

workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        PACKAGE_NAME: com.smartfin.app
      node: 18.17.0
      java: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install react-native-inappbrowser-reborn
          npm install @react-native-community/netinfo @react-native-async-storage/async-storage expo-splash-screen
          npm install sharp
      - name: Process app icons for proper sizing
        script: |
          # Create a Node.js script to process icons with proper sizing and padding
          cat > process-icons.js << 'ICONSCRIPT'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          async function processIcons() {
            const assetsDir = './assets';
            const iconPath = path.join(assetsDir, 'icon.png');
            const adaptiveIconPath = path.join(assetsDir, 'adaptive-icon.png');
            const faviconPath = path.join(assetsDir, 'favicon.png');
            
            if (!fs.existsSync(iconPath)) {
              console.log('No icon.png found, skipping icon processing');
              return;
            }
            
            console.log('Processing app icons...');
            
            try {
              // Read the original icon
              const iconBuffer = fs.readFileSync(iconPath);
              
              // Process main icon - resize to 1024x1024 and ensure it's centered
              const mainIcon = await sharp(iconBuffer)
                .resize(1024, 1024, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .png()
                .toBuffer();
              fs.writeFileSync(iconPath, mainIcon);
              console.log('✓ Processed icon.png (1024x1024)');
              
              // Process adaptive icon for Android - add 20% padding for safe zone
              // Android adaptive icons crop outer ~18% so we need padding
              const paddedSize = Math.floor(1024 * 0.7); // Icon at 70% of canvas
              const padding = Math.floor((1024 - paddedSize) / 2);
              
              const adaptiveIcon = await sharp(iconBuffer)
                .resize(paddedSize, paddedSize, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .extend({
                  top: padding,
                  bottom: padding,
                  left: padding,
                  right: padding,
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .resize(1024, 1024) // Ensure final size is exactly 1024x1024
                .png()
                .toBuffer();
              fs.writeFileSync(adaptiveIconPath, adaptiveIcon);
              console.log('✓ Processed adaptive-icon.png (1024x1024 with safe zone padding)');
              
              // Process favicon
              const favicon = await sharp(iconBuffer)
                .resize(48, 48, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .png()
                .toBuffer();
              fs.writeFileSync(faviconPath, favicon);
              console.log('✓ Processed favicon.png (48x48)');
              
              console.log('All icons processed successfully!');
            } catch (error) {
              console.error('Error processing icons:', error.message);
              // Don't fail the build, just log the error
            }
          }
          
          processIcons();
          ICONSCRIPT
          node process-icons.js
      - name: Generate Android project
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Fix Android SDK version for SDK 34 compatibility
        script: |
          echo "=== Enforcing Android SDK 34 + compatible Gradle/AGP ==="
          
          # Use a deterministic patcher instead of sed (handles Groovy/Kotlin DSL + different templates)
          cat > patch-android.js << 'PATCHSCRIPT'
          const fs = require('fs');
          
          const DESIRED_COMPILE_SDK = 34;
          const DESIRED_TARGET_SDK = 34;
          // AGP 8.2.2 supports compileSdk 34 and works with Gradle 8.2.1
          const DESIRED_AGP = '8.2.2';
          const DESIRED_GRADLE_DIST = 'https\://services.gradle.org/distributions/gradle-8.2.1-all.zip';
          
          function readText(file) {
            return fs.readFileSync(file, 'utf8');
          }
          
          function writeText(file, text) {
            fs.writeFileSync(file, text);
          }
          
          function patchFile(file, replacers) {
            if (!fs.existsSync(file)) return false;
            let text = readText(file);
            const before = text;
            for (const [re, replacement] of replacers) {
              text = text.replace(re, replacement);
            }
            if (text !== before) {
              writeText(file, text);
              return true;
            }
            return false;
          }
          
          function upsertProp(file, key, value) {
            if (!fs.existsSync(file)) return;
            let text = readText(file);
            // Avoid template interpolation by keeping '$' last in the character class.
            const escapedKey = key.replace(/[.*+?^{}()|[\]\$]/g, '\$&');
            const re = new RegExp('^\s*' + escapedKey + '\s*=.*$', 'm');
            const line = key + '=' + value;
            if (re.test(text)) {
              text = text.replace(re, line);
            } else {
              if (!text.endsWith('
')) text += '
';
              text += line + '
';
            }
            writeText(file, text);
          }
          
          // 1) Ensure gradle.properties opts into SDK 34 if the template uses findProperty(...)
          if (fs.existsSync('android/gradle.properties')) {
            upsertProp('android/gradle.properties', 'android.compileSdkVersion', String(DESIRED_COMPILE_SDK));
            upsertProp('android/gradle.properties', 'android.targetSdkVersion', String(DESIRED_TARGET_SDK));
          }
          
          // 2) Update Gradle wrapper
          patchFile('android/gradle/wrapper/gradle-wrapper.properties', [
            [/^distributionUrl=.*$/m, 'distributionUrl=' + DESIRED_GRADLE_DIST],
          ]);
          
          // 3) Update AGP wherever it appears
          const agpReplacers = [
            // buildscript classpath (Groovy)
            [/com\.android\.tools\.build:gradle:[0-9.]+/g, 'com.android.tools.build:gradle:' + DESIRED_AGP],
            // plugins DSL (Groovy)
            [/id ['"]com\.android\.application['"] version ['"][0-9.]+['"]/g, 'id "com.android.application" version "' + DESIRED_AGP + '"'],
            [/id ['"]com\.android\.library['"] version ['"][0-9.]+['"]/g, 'id "com.android.library" version "' + DESIRED_AGP + '"'],
            // plugins DSL (Kotlin)
            [/id\("com\.android\.application"\) version "[0-9.]+"/g, 'id("com.android.application") version "' + DESIRED_AGP + '"'],
            [/id\("com\.android\.library"\) version "[0-9.]+"/g, 'id("com.android.library") version "' + DESIRED_AGP + '"'],
            // classpath Kotlin
            [/classpath\("com\.android\.tools\.build:gradle:[0-9.]+"\)/g, 'classpath("com.android.tools.build:gradle:' + DESIRED_AGP + '")'],
          ];
          
          patchFile('android/build.gradle', agpReplacers);
          patchFile('android/build.gradle.kts', agpReplacers);
          patchFile('android/settings.gradle', agpReplacers);
          patchFile('android/settings.gradle.kts', agpReplacers);
          
          // 4) Force compileSdk/targetSdk in common places (when literals exist)
          const sdkReplacers = [
            [/compileSdkVersion\s*=\s*\d+/g, 'compileSdkVersion = ' + DESIRED_COMPILE_SDK],
            [/targetSdkVersion\s*=\s*\d+/g, 'targetSdkVersion = ' + DESIRED_TARGET_SDK],
            [/compileSdkVersion\s+\d+/g, 'compileSdkVersion ' + DESIRED_COMPILE_SDK],
            [/targetSdkVersion\s+\d+/g, 'targetSdkVersion ' + DESIRED_TARGET_SDK],
            [/compileSdk\s*=\s*\d+/g, 'compileSdk = ' + DESIRED_COMPILE_SDK],
            [/targetSdk\s*=\s*\d+/g, 'targetSdk = ' + DESIRED_TARGET_SDK],
            [/compileSdk\s+\d+/g, 'compileSdk ' + DESIRED_COMPILE_SDK],
            [/targetSdk\s+\d+/g, 'targetSdk ' + DESIRED_TARGET_SDK],
            // expo templates sometimes use findProperty fallbacks like '33'
            [/(findProperty\('android\.compileSdkVersion'\)\s*\?:\s*')\d+(')/g, '$1' + DESIRED_COMPILE_SDK + '$2'],
            [/(findProperty\('android\.targetSdkVersion'\)\s*\?:\s*')\d+(')/g, '$1' + DESIRED_TARGET_SDK + '$2'],
          ];
          
          patchFile('android/build.gradle', sdkReplacers);
          patchFile('android/build.gradle.kts', sdkReplacers);
          patchFile('android/app/build.gradle', sdkReplacers);
          patchFile('android/app/build.gradle.kts', sdkReplacers);
          
          console.log('Patched Android project to compileSdk ' + DESIRED_COMPILE_SDK + ', targetSdk ' + DESIRED_TARGET_SDK + ', AGP ' + DESIRED_AGP);
          PATCHSCRIPT
          
          node patch-android.js
          
          echo "--- Verify patched values (best-effort) ---"
          (grep -R "compileSdk" -n android/app/build.gradle android/app/build.gradle.kts android/build.gradle android/build.gradle.kts 2>/dev/null || true)
          (grep -R "com.android.tools.build:gradle" -n android/build.gradle android/build.gradle.kts android/settings.gradle android/settings.gradle.kts 2>/dev/null || true)
          (grep -n "^distributionUrl" android/gradle/wrapper/gradle-wrapper.properties 2>/dev/null || true)
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android APK
        script: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          cd android && ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"
      - name: Build Android App Bundle (AAB)
        script: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          cd android && ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"
      - name: Organize artifacts
        script: |
          mkdir -p $CM_BUILD_DIR/build/outputs
          find android/app/build/outputs -name "*.apk" -exec cp {} $CM_BUILD_DIR/build/outputs/ \;
          find android/app/build/outputs -name "*.aab" -exec cp {} $CM_BUILD_DIR/build/outputs/ \;
          ls -la $CM_BUILD_DIR/build/outputs/
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - build/outputs/*.apk
      - build/outputs/*.aab
    publishing:
      email:
        recipients:
          - team@example.com
        notify:
          success: false
          failure: true

  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        BUNDLE_ID: com.smartfin.app
      node: 18.17.0
      xcode: 16.2
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install react-native-inappbrowser-reborn
          npm install @react-native-community/netinfo @react-native-async-storage/async-storage expo-splash-screen
          npm install sharp
      - name: Process app icons for proper sizing
        script: |
          # Create a Node.js script to process icons with proper sizing
          cat > process-icons.js << 'ICONSCRIPT'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          async function processIcons() {
            const assetsDir = './assets';
            const iconPath = path.join(assetsDir, 'icon.png');
            const faviconPath = path.join(assetsDir, 'favicon.png');
            
            if (!fs.existsSync(iconPath)) {
              console.log('No icon.png found, skipping icon processing');
              return;
            }
            
            console.log('Processing app icons for iOS...');
            
            try {
              // Read the original icon
              const iconBuffer = fs.readFileSync(iconPath);
              
              // Process main icon - resize to 1024x1024 and ensure it's centered
              const mainIcon = await sharp(iconBuffer)
                .resize(1024, 1024, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 1 }
                })
                .png()
                .toBuffer();
              fs.writeFileSync(iconPath, mainIcon);
              console.log('✓ Processed icon.png (1024x1024)');
              
              // Process favicon
              const favicon = await sharp(iconBuffer)
                .resize(48, 48, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 1 }
                })
                .png()
                .toBuffer();
              fs.writeFileSync(faviconPath, favicon);
              console.log('✓ Processed favicon.png (48x48)');
              
              console.log('All icons processed successfully!');
            } catch (error) {
              console.error('Error processing icons:', error.message);
              // Don't fail the build, just log the error
            }
          }
          
          processIcons();
          ICONSCRIPT
          node process-icons.js
      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Patch Boost podspec URL (fix checksum mismatch)
        script: |
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          if [ -f "$BOOST_PODSPEC" ]; then
            echo "Patching Boost podspec with working mirror..."
            BOOST_URL="https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2"
            sed -i.bak "s|https://boostorg.jfrog.io/artifactory/main/release/[^']*|$BOOST_URL|g" "$BOOST_PODSPEC"
            grep -n "spec.source" "$BOOST_PODSPEC" || true
          else
            echo "Boost podspec not found (skipping patch)"
          fi
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods ~/.cocoapods/repos || true
          pod cache clean boost --all || true
          pod repo update
          pod install --repo-update --clean-install
      - name: Create exportOptions.plist
        script: |
          cat > ios/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
      - name: Build iOS Archive
        script: |
          cd ios
          SCHEME_NAME=$(xcodebuild -list -json | jq -r '.project.schemes[0]')
          xcodebuild -workspace *.xcworkspace -scheme "$SCHEME_NAME" -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Create unsigned IPA
        script: |
          mkdir -p $CM_BUILD_DIR/build/ipa
          cd $CM_BUILD_DIR/build/App.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r $CM_BUILD_DIR/build/ipa/SmartFinance.ipa Payload
          ls -la $CM_BUILD_DIR/build/ipa/
    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
