# Codemagic CI/CD configuration for SmartFinance
# Generated by Web2App Converter

workflows:
  android-workflow:
    name: Android Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        PACKAGE_NAME: com.smartfin.app
      node: 18.17.0
      java: "17"
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install react-native-inappbrowser-reborn
          npm install @react-native-community/netinfo @react-native-async-storage/async-storage expo-splash-screen
          npm install sharp
      - name: Process app icons for proper sizing
        script: |
          # Create a Node.js script to process icons with proper sizing and padding
          cat > process-icons.js << 'ICONSCRIPT'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          async function processIcons() {
            const assetsDir = './assets';
            const iconPath = path.join(assetsDir, 'icon.png');
            const adaptiveIconPath = path.join(assetsDir, 'adaptive-icon.png');
            const faviconPath = path.join(assetsDir, 'favicon.png');
            
            if (!fs.existsSync(iconPath)) {
              console.log('No icon.png found, skipping icon processing');
              return;
            }
            
            console.log('Processing app icons...');
            
            try {
              // Read the original icon
              const iconBuffer = fs.readFileSync(iconPath);
              
              // Process main icon - resize to 1024x1024 and ensure it's centered
              const mainIcon = await sharp(iconBuffer)
                .resize(1024, 1024, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .png()
                .toBuffer();
              fs.writeFileSync(iconPath, mainIcon);
              console.log('✓ Processed icon.png (1024x1024)');
              
              // Process adaptive icon for Android - add 20% padding for safe zone
              // Android adaptive icons crop outer ~18% so we need padding
              const paddedSize = Math.floor(1024 * 0.7); // Icon at 70% of canvas
              const padding = Math.floor((1024 - paddedSize) / 2);
              
              const adaptiveIcon = await sharp(iconBuffer)
                .resize(paddedSize, paddedSize, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .extend({
                  top: padding,
                  bottom: padding,
                  left: padding,
                  right: padding,
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .resize(1024, 1024) // Ensure final size is exactly 1024x1024
                .png()
                .toBuffer();
              fs.writeFileSync(adaptiveIconPath, adaptiveIcon);
              console.log('✓ Processed adaptive-icon.png (1024x1024 with safe zone padding)');
              
              // Process favicon
              const favicon = await sharp(iconBuffer)
                .resize(48, 48, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 0 }
                })
                .png()
                .toBuffer();
              fs.writeFileSync(faviconPath, favicon);
              console.log('✓ Processed favicon.png (48x48)');
              
              console.log('All icons processed successfully!');
            } catch (error) {
              console.error('Error processing icons:', error.message);
              // Don't fail the build, just log the error
            }
          }
          
          processIcons();
          ICONSCRIPT
          node process-icons.js
      - name: Generate Android project
        script: |
          npx expo prebuild --platform android --clean --no-install
      - name: Ensure Android SDK 34
        script: |
          echo "=== Ensuring Android compile/target SDK 34 ==="
          PROP_FILE="android/gradle.properties"
          upsert_prop () {
            KEY="$1"
            VALUE="$2"
            if [ -f "$PROP_FILE" ] && grep -q "^$KEY=" "$PROP_FILE"; then
              sed -i.bak "s/^$KEY=.*/$KEY=$VALUE/" "$PROP_FILE"
            else
              echo "$KEY=$VALUE" >> "$PROP_FILE"
            fi
          }
          upsert_prop android.compileSdkVersion 34
          upsert_prop android.targetSdkVersion 34
          echo "--- Patching build.gradle files for SDK 34 ---"
          # First handle Integer.parseInt patterns (replace entire expression)
          find android -name "build.gradle" -exec sed -i.bak -E "s/compileSdkVersion[[:space:]]*=[[:space:]]*Integer\.parseInt\([^)]+\)/compileSdkVersion = 34/g" {} \;
          find android -name "build.gradle" -exec sed -i.bak -E "s/targetSdkVersion[[:space:]]*=[[:space:]]*Integer\.parseInt\([^)]+\)/targetSdkVersion = 34/g" {} \;
          find android -name "build.gradle" -exec sed -i.bak -E "s/compileSdk[[:space:]]*=[[:space:]]*Integer\.parseInt\([^)]+\)/compileSdk = 34/g" {} \;
          find android -name "build.gradle" -exec sed -i.bak -E "s/targetSdk[[:space:]]*=[[:space:]]*Integer\.parseInt\([^)]+\)/targetSdk = 34/g" {} \;
          # Then handle simple numeric assignments
          find android -name "build.gradle" -exec sed -i.bak -E "s/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 34/g" {} \;
          find android -name "build.gradle" -exec sed -i.bak -E "s/targetSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/targetSdkVersion = 34/g" {} \;
          find android -name "build.gradle" -exec sed -i.bak -E "s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g" {} \;
          find android -name "build.gradle" -exec sed -i.bak -E "s/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 34/g" {} \;
          # Handle Groovy DSL without = sign (e.g., compileSdkVersion 35)
          find android -name "build.gradle" -exec sed -i.bak -E "s/compileSdkVersion[[:space:]]+[0-9]+$/compileSdkVersion 34/g" {} \;
          find android -name "build.gradle" -exec sed -i.bak -E "s/targetSdkVersion[[:space:]]+[0-9]+$/targetSdkVersion 34/g" {} \;
          # Handle Kotlin DSL
          find android -name "build.gradle.kts" -exec sed -i.bak -E "s/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 34/g" {} \;
          find android -name "build.gradle.kts" -exec sed -i.bak -E "s/targetSdk[[:space:]]*=[[:space:]]*[0-9]+/targetSdk = 34/g" {} \;
          echo "--- Verify patched values ---"
          grep -r "compileSdk" android/app/build.gradle 2>/dev/null || true
          grep -r "targetSdk" android/app/build.gradle 2>/dev/null || true
      - name: Set up local.properties
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > android/local.properties
      - name: Build Android APK
        script: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          cd android && ./gradlew assembleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"
      - name: Build Android App Bundle (AAB)
        script: |
          export NODE_OPTIONS="--max-old-space-size=4096"
          cd android && ./gradlew bundleRelease --no-daemon -Dorg.gradle.jvmargs="-Xmx4096m"
      - name: Organize artifacts
        script: |
          mkdir -p $CM_BUILD_DIR/build/outputs
          find android/app/build/outputs -name "*.apk" -exec cp {} $CM_BUILD_DIR/build/outputs/ \;
          find android/app/build/outputs -name "*.aab" -exec cp {} $CM_BUILD_DIR/build/outputs/ \;
          ls -la $CM_BUILD_DIR/build/outputs/
    artifacts:
      - android/app/build/outputs/**/*.apk
      - android/app/build/outputs/**/*.aab
      - build/outputs/*.apk
      - build/outputs/*.aab
    publishing:
      email:
        recipients:
          - team@example.com
        notify:
          success: false
          failure: true

  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m2
    max_build_duration: 120
    environment:
      vars:
        BUNDLE_ID: com.smartfin.app
      node: 18.17.0
      xcode: 16.2
      cocoapods: default
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install react-native-inappbrowser-reborn
          npm install @react-native-community/netinfo @react-native-async-storage/async-storage expo-splash-screen
          npm install sharp
      - name: Process app icons for proper sizing
        script: |
          # Create a Node.js script to process icons with proper sizing
          cat > process-icons.js << 'ICONSCRIPT'
          const sharp = require('sharp');
          const fs = require('fs');
          const path = require('path');
          
          async function processIcons() {
            const assetsDir = './assets';
            const iconPath = path.join(assetsDir, 'icon.png');
            const faviconPath = path.join(assetsDir, 'favicon.png');
            
            if (!fs.existsSync(iconPath)) {
              console.log('No icon.png found, skipping icon processing');
              return;
            }
            
            console.log('Processing app icons for iOS...');
            
            try {
              // Read the original icon
              const iconBuffer = fs.readFileSync(iconPath);
              
              // Process main icon - resize to 1024x1024 and ensure it's centered
              const mainIcon = await sharp(iconBuffer)
                .resize(1024, 1024, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 1 }
                })
                .png()
                .toBuffer();
              fs.writeFileSync(iconPath, mainIcon);
              console.log('✓ Processed icon.png (1024x1024)');
              
              // Process favicon
              const favicon = await sharp(iconBuffer)
                .resize(48, 48, {
                  fit: 'contain',
                  background: { r: 255, g: 255, b: 255, alpha: 1 }
                })
                .png()
                .toBuffer();
              fs.writeFileSync(faviconPath, favicon);
              console.log('✓ Processed favicon.png (48x48)');
              
              console.log('All icons processed successfully!');
            } catch (error) {
              console.error('Error processing icons:', error.message);
              // Don't fail the build, just log the error
            }
          }
          
          processIcons();
          ICONSCRIPT
          node process-icons.js
      - name: Generate iOS project
        script: |
          npx expo prebuild --platform ios --clean --no-install
      - name: Patch Boost podspec URL (fix checksum mismatch)
        script: |
          BOOST_PODSPEC="node_modules/react-native/third-party-podspecs/boost.podspec"
          if [ -f "$BOOST_PODSPEC" ]; then
            echo "Patching Boost podspec with working mirror..."
            BOOST_URL="https://archives.boost.io/release/1.76.0/source/boost_1_76_0.tar.bz2"
            sed -i.bak "s|https://boostorg.jfrog.io/artifactory/main/release/[^']*|$BOOST_URL|g" "$BOOST_PODSPEC"
            grep -n "spec.source" "$BOOST_PODSPEC" || true
          else
            echo "Boost podspec not found (skipping patch)"
          fi
      - name: Install CocoaPods
        script: |
          cd ios
          rm -rf Pods Podfile.lock
          rm -rf ~/Library/Caches/CocoaPods ~/.cocoapods/repos || true
          pod cache clean boost --all || true
          pod repo update
          pod install --repo-update --clean-install
      - name: Create exportOptions.plist
        script: |
          cat > ios/exportOptions.plist << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>compileBitcode</key>
            <false/>
            <key>thinning</key>
            <string>&lt;none&gt;</string>
          </dict>
          </plist>
          EOF
      - name: Build iOS Archive
        script: |
          cd ios
          SCHEME_NAME=$(xcodebuild -list -json | jq -r '.project.schemes[0]')
          xcodebuild -workspace *.xcworkspace -scheme "$SCHEME_NAME" -configuration Release -sdk iphoneos -archivePath $CM_BUILD_DIR/build/App.xcarchive archive CODE_SIGNING_ALLOWED=NO
      - name: Create unsigned IPA
        script: |
          mkdir -p $CM_BUILD_DIR/build/ipa
          cd $CM_BUILD_DIR/build/App.xcarchive/Products/Applications
          mkdir -p Payload
          cp -r *.app Payload/
          zip -r $CM_BUILD_DIR/build/ipa/SmartFinance.ipa Payload
          ls -la $CM_BUILD_DIR/build/ipa/
    artifacts:
      - build/ipa/*.ipa
      - build/*.xcarchive
